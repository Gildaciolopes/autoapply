[project]
name = "autoapply-scraper"
version = "0.1.0"
description = "AutoApply job discovery worker (JobSpy + BullMQ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bullmq>=3.3.4",
    "pydantic>=2.14.1",
    "python-jobspy>=1.3.0",
]

[project.scripts]
autoapply-scraper = "autoapply_scraper:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
